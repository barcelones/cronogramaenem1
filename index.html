<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma ENEM 800+ | Premium</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #09090b;
            --sidebar: #121214;
            --card: #18181b;
            --border: #27272a;
            --text: #f8fafc;
            --text-muted: #a1a1aa;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- UI/UX: Sidebar Premium --- */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 30px 16px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: -1px;
        }
        .logo span { color: var(--primary); }

        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }

        .nav-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--card);
            color: var(--text);
        }
        .nav-item.active {
            color: var(--primary);
            border-left: 3px solid var(--primary);
        }

        /* --- Main Content --- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .topbar {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* --- Gamificação: Barra de XP --- */
        .xp-container { display: flex; align-items: center; gap: 15px; }
        .xp-label { font-weight: 700; color: var(--primary); font-size: 0.85rem; }
        .xp-bar-bg {
            width: 200px;
            height: 10px;
            background: var(--card);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .xp-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), #a78bfa);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .content-area { padding: 40px; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Dashboard Cards --- */
        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card-stat {
            background: var(--card);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .card-stat h3 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
        .card-stat p { font-size: 1.8rem; font-weight: 700; }

        /* --- Mapa de Progresso (Estilo PDF) --- */
        .subject-section { margin-bottom: 40px; }
        .subject-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; color: var(--primary); }
        
        .progress-table {
            width: 100%;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            border-collapse: collapse;
        }
        .progress-table th, .progress-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .progress-table th { background: #1c1c1f; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
        
        .col-check { width: 80px; text-align: center !important; }
        
        /* Checkboxes Customizados */
        .cb-container {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cb-container.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .login-overlay {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .btn-google {
            background: white; color: black; padding: 12px 24px;
            border-radius: 8px; font-weight: 700; border: none; cursor: pointer;
        }

    </style>
</head>
<body>

<div id="login-screen" class="login-overlay">
    <div style="text-align: center;">
        <h1 style="margin-bottom: 20px;">Plataforma <span>800+</span></h1>
        <button class="btn-google" onclick="loginGoogle()">Entrar com Google</button>
    </div>
</div>

<nav class="sidebar">
    <div class="logo">ENEM <span>800+</span></div>
    <div class="nav-menu">
        <button class="nav-item active" onclick="showPage('dash', this)">📊 Dashboard</button>
        <button class="nav-item" onclick="showPage('mapa', this)">🗺️ Mapa de Progresso</button>
        <button class="nav-item" onclick="showPage('foco', this)">⏱️ Modo Foco</button>
    </div>
    <div class="user-profile" id="user-info" style="display:none; padding-top: 20px; border-top: 1px solid var(--border);">
        <img id="user-photo" src="" style="width:35px; border-radius:50%; margin-right:10px;">
        <span id="user-name" style="font-size: 0.9rem; font-weight: 600;">Estudante</span>
    </div>
</nav>

<main class="main">
    <header class="topbar">
        <h2 id="page-title">Dashboard</h2>
        <div class="xp-container">
            <span class="xp-label" id="xp-level">LVL 01</span>
            <div class="xp-bar-bg">
                <div class="xp-bar-fill" id="xp-fill"></div>
            </div>
            <span id="xp-text" style="font-size: 0.75rem; color: var(--text-muted);">0 / 1000 XP</span>
        </div>
    </header>

    <div class="content-area">
        <section id="dash" class="page active">
            <div class="grid-stats">
                <div class="card-stat"><h3>Meta</h3><p>800+</p></div>
                <div class="card-stat"><h3>Dias p/ ENEM</h3><p id="countdown">--</p></div>
                <div class="card-stat"><h3>Tópicos Dominados</h3><p id="dash-mastery">0</p></div>
            </div>
        </section>

        <section id="mapa" class="page">
            <div class="subject-section">
                <h3 class="subject-title">Matemática e suas Tecnologias</h3>
                <table class="progress-table">
                    <thead>
                        <tr>
                            <th>Tópico do PDF</th>
                            <th class="col-check">Teoria</th>
                            <th class="col-check">Prática</th>
                            <th class="col-check">Domínio</th>
                        </tr>
                    </thead>
                    <tbody id="mapa-content">
                        </tbody>
                </table>
            </div>
        </section>

        <section id="foco" class="page">
            <div class="card-stat" style="text-align: center; max-width: 400px; margin: auto;">
                <h3>Pomodoro</h3>
                <p id="timer-display" style="font-size: 4rem; margin: 20px 0;">25:00</p>
                <button class="btn-google" style="background: var(--primary); color: white;" onclick="toggleTimer()">Iniciar / Pausar</button>
            </div>
        </section>
    </div>
</main>

<script>
// --- Configuração Firebase (Sua Configuração) ---
const firebaseConfig = {
    apiKey: "AIzaSyDAozYqHIjJe-ptzkVIfqLMC2XTyMG0GaI",
    authDomain: "meucronogramaenem.firebaseapp.com",
    projectId: "meucronogramaenem",
    storageBucket: "meucronogramaenem.firebasestorage.app",
    messagingSenderId: "933774063012",
    appId: "1:933774063012:web:5f3556ea2c0f1885a4bd31"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// --- Dados do Mapa (Inspirado no PDF Mapa de Progresso Competitivo) ---
const mapaData = [
    { area: "Nivelamento", topico: "Operações Básicas e Sinais" },
    { area: "Nivelamento", topico: "Fração e Decimais" },
    { area: "Matemática", topico: "Razão, Proporção e Escala" },
    { area: "Matemática", topico: "Porcentagem" },
    { area: "Matemática", topico: "Funções de 1º Grau" },
    { area: "Matemática", topico: "Geometria Plana: Áreas" },
    { area: "Natureza", topico: "Citologia e Membrana" },
    { area: "Natureza", topico: "Estequiometria" },
    { area: "Natureza", topico: "Cinemática Básica" }
];

let userData = {
    xp: 0,
    progresso: {}
};

// --- Autenticação ---
function loginGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider);
}

auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('user-info').style.display = 'flex';
        document.getElementById('user-name').innerText = user.displayName;
        document.getElementById('user-photo').src = user.photoURL;
        loadUserData(user.uid);
    } else {
        document.getElementById('login-screen').style.display = 'flex';
    }
});

// --- Carregar/Salvar Firebase ---
async function loadUserData(uid) {
    const doc = await db.collection('usuarios').doc(uid).get();
    if (doc.exists) {
        userData = doc.data();
    }
    renderMapa();
    updateUI();
    initCountdown();
}

async function saveData() {
    const user = auth.currentUser;
    if (user) {
        await db.collection('usuarios').doc(user.uid).set(userData);
    }
}

// --- Lógica do Mapa e XP ---
function renderMapa() {
    const tbody = document.getElementById('mapa-content');
    tbody.innerHTML = '';
    
    mapaData.forEach((item, index) => {
        const tr = document.createElement('tr');
        const prog = userData.progresso[index] || { t: false, p: false, d: false };
        
        tr.innerHTML = `
            <td><span style="font-size:0.7rem; color:var(--text-muted)">${item.area}</span><br>${item.topico}</td>
            <td class="col-check"><div class="cb-container ${prog.t ? 'active' : ''}" onclick="toggleCheck(${index}, 't')"></div></td>
            <td class="col-check"><div class="cb-container ${prog.p ? 'active' : ''}" onclick="toggleCheck(${index}, 'p')"></div></td>
            <td class="col-check"><div class="cb-container ${prog.d ? 'active' : ''}" onclick="toggleCheck(${index}, 'd')"></div></td>
        `;
        tbody.appendChild(tr);
    });
}

function toggleCheck(index, type) {
    if (!userData.progresso[index]) userData.progresso[index] = { t: false, p: false, d: false };
    
    const currentState = userData.progresso[index][type];
    userData.progresso[index][type] = !currentState;
    
    // Ganho de XP: 50 por teoria, 100 por prática, 200 por domínio
    if (!currentState) {
        const xpGained = type === 't' ? 50 : type === 'p' ? 100 : 200;
        userData.xp += xpGained;
    } else {
        const xpLost = type === 't' ? 50 : type === 'p' ? 100 : 200;
        userData.xp = Math.max(0, userData.xp - xpLost);
    }

    renderMapa();
    updateUI();
    saveData();
}

function updateUI() {
    // XP e Level
    const level = Math.floor(userData.xp / 1000) + 1;
    const currentXP = userData.xp % 1000;
    const percent = (currentXP / 1000) * 100;

    document.getElementById('xp-level').innerText = `LVL ${String(level).padStart(2, '0')}`;
    document.getElementById('xp-fill').style.width = `${percent}%`;
    document.getElementById('xp-text').innerText = `${currentXP} / 1000 XP`;

    // Dashboard Mastery
    let masteryCount = 0;
    Object.values(userData.progresso).forEach(p => { if(p.d) masteryCount++; });
    document.getElementById('dash-mastery').innerText = masteryCount;
}

// --- Navegação ---
function showPage(id, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
    document.getElementById('page-title').innerText = btn.innerText;
}

// --- Countdown ENEM 2026 ---
function initCountdown() {
    const target = new Date('2026-11-01T00:00:00').getTime();
    const now = new Date().getTime();
    const diff = target - now;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    document.getElementById('countdown').innerText = days;
}

// --- Timer Pomodoro ---
let timer;
let timeLeft = 1500;
function toggleTimer() {
    if (timer) {
        clearInterval(timer);
        timer = null;
    } else {
        timer = setInterval(() => {
            timeLeft--;
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${mins}:${String(secs).padStart(2,'0')}`;
            if(timeLeft <= 0) clearInterval(timer);
        }, 1000);
    }
}
</script>
</body>
</html>
