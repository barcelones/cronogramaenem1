<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Aprovação - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #0f172a; --card-bg: #1e293b; --primary: #38bdf8;
            --text: #f1f5f9; --danger: #ef4444; --success: #22c55e;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

        /* Estilo da Tela de Login */
        #login-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center;
        }
        .btn-google {
            background-color: #ffffff; color: #000; padding: 15px 30px; border-radius: 8px;
            font-weight: bold; cursor: pointer; border: none; display: flex; align-items: center; gap: 10px;
            font-size: 16px; transition: 0.3s; margin-top: 20px;
        }
        .btn-google:hover { background-color: #f1f5f9; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        /* Dashboard Principal */
        #dashboard { display: none; width: 100%; max-width: 1100px; padding: 20px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px; background: var(--card-bg); border-radius: 15px; 
            margin-bottom: 30px; border: 1px solid var(--border);
        }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary); }

        .section-title { margin-bottom: 20px; font-size: 1.5rem; color: var(--primary); }

        /* Grid de Temporizadores */
        .timers-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; margin-bottom: 40px;
        }
        
        .timer-card { 
            background: var(--card-bg); padding: 30px; border-radius: 20px; 
            text-align: center; border: 1px solid var(--border);
            transition: transform 0.3s;
        }
        .timer-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        
        .display-time { font-size: 3.5rem; font-weight: 800; margin: 20px 0; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
        
        .controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn { 
            padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; 
            font-weight: 700; transition: 0.2s; font-size: 0.9rem;
        }
        .btn-start { background: var(--success); color: #052e16; }
        .btn-pause { background: var(--primary); color: #082f49; }
        .btn-reset { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-logout { background: var(--danger); color: white; }

        @media (max-width: 600px) {
            .header { flex-direction: column; gap: 15px; text-align: center; }
            .display-time { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="font-size: 2.5rem;">🎯 Cronograma <span style="color:var(--primary)">Aprovação</span></h1>
        <p style="color: #94a3b8; max-width: 400px;">Seu painel de estudos sincronizado na nuvem para o ENEM 2026.</p>
        <button class="btn-google" onclick="loginGoogle()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20">
            Entrar com o Google
        </button>
    </div>

    <div id="dashboard">
        <header class="header">
            <div class="user-info">
                <img id="user-pic" src="" alt="Avatar">
                <div>
                    <h2 id="user-name">Carregando...</h2>
                    <small style="color: var(--success)">● Conectado ao Firebase Cloud</small>
                </div>
            </div>
            <button class="btn btn-logout" onclick="logout()">Sair da Conta</button>
        </header>

        <h3 class="section-title">Gerenciador de Tempo</h3>
        
        <div class="timers-grid">
            <div class="timer-card">
                <h4 style="color: var(--primary)">Pomodoro (Foco)</h4>
                <div class="display-time" id="pomo-display">50:00</div>
                <div class="controls">
                    <button class="btn btn-start" onclick="startTimer('pomo', 3000)">Iniciar</button>
                    <button class="btn btn-pause" onclick="pauseTimer('pomo')">Pausar</button>
                    <button class="btn btn-reset" onclick="resetTimer('pomo', 3000)">Reset</button>
                </div>
            </div>

            <div class="timer-card">
                <h4 style="color: #f59e0b">Simulado / Livre</h4>
                <div class="display-time" id="stopwatch-display">00:00</div>
                <div class="controls">
                    <button class="btn btn-start" onclick="startStopwatch()">Iniciar</button>
                    <button class="btn btn-pause" onclick="pauseStopwatch()">Pausar</button>
                    <button class="btn btn-reset" onclick="resetStopwatch()">Reset</button>
                </div>
            </div>

            <div class="timer-card">
                <h4 style="color: #8b5cf6">Pausa Curta</h4>
                <div class="display-time" id="break-display">10:00</div>
                <div class="controls">
                    <button class="btn btn-start" onclick="startTimer('break', 600)">Iniciar</button>
                    <button class="btn btn-pause" onclick="pauseTimer('break')">Pausar</button>
                    <button class="btn btn-reset" onclick="resetTimer('break', 600)">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO FIREBASE (COLE SUAS CHAVES AQUI!)
        const firebaseConfig = {
            apiKey: "COLE_SUA_API_KEY",
            authDomain: "COLE_SEU_AUTH_DOMAIN",
            projectId: "COLE_SEU_PROJECT_ID",
            storageBucket: "COLE_SEU_STORAGE_BUCKET",
            messagingSenderId: "COLE_SEU_SENDER_ID",
            appId: "COLE_SEU_APP_ID"
        };

        // Inicialização
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Lógica de Autenticação
        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('user-name').innerText = `Olá, ${user.displayName.split(' ')[0]}!`;
                document.getElementById('user-pic').src = user.photoURL;
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('dashboard').style.display = 'none';
            }
        });

        // Lógica de Temporizadores
        let timers = { pomo: { interval: null, left: 3000 }, break: { interval: null, left: 600 } };
        let stopwatch = { interval: null, elapsed: 0 };

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer(type, defaultTime) {
            clearInterval(timers[type].interval);
            timers[type].interval = setInterval(() => {
                if (timers[type].left > 0) {
                    timers[type].left--;
                    document.getElementById(`${type}-display`).innerText = formatTime(timers[type].left);
                } else {
                    clearInterval(timers[type].interval);
                    alert("Bloco finalizado!");
                }
            }, 1000);
        }

        function pauseTimer(type) { clearInterval(timers[type].interval); }
        function resetTimer(type, defaultTime) {
            pauseTimer(type);
            timers[type].left = defaultTime;
            document.getElementById(`${type}-display`).innerText = formatTime(defaultTime);
        }

        function startStopwatch() {
            clearInterval(stopwatch.interval);
            stopwatch.interval = setInterval(() => {
                stopwatch.elapsed++;
                document.getElementById('stopwatch-display').innerText = formatTime(stopwatch.elapsed);
            }, 1000);
        }
        function pauseStopwatch() { clearInterval(stopwatch.interval); }
        function resetStopwatch() {
            pauseStopwatch();
            stopwatch.elapsed = 0;
            document.getElementById('stopwatch-display').innerText = "00:00";
        }
    </script>
</body>
</html>
